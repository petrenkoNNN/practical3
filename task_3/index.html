<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Банковская карта</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .text,
    .color {
      padding: 8px 12px;
      font-size: 14px;
      border: 2px solid #ccc;
      border-radius: 6px;
      background: #fff;
      outline: none;
    }

    .text {
      flex: 1;
    }

    #card {
      display: flex;
      align-items: flex-end;
      box-sizing: border-box;
      width: 100%;
      height: 220px;
      margin: 0;
      padding: 24px;
      border-radius: 16px;
      background: #e53935;
      color: #fff;
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      word-break: break-word;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: background 0.3s;
    }
  </style>
</head>
<body>
  <div class="controls">
    <input type="text" class="text" placeholder="Введите текст" maxlength="30">

    <select class="color">
      <option value="red">Красный</option>
      <option value="blue">Синий</option>
      <option value="green">Зелёный</option>
    </select>
  </div>

  <p id="card">Ваш текст</p>

  <script src="index.js"></script>
</body>
</html>
