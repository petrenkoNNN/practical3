<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма опроса</title>
  <style>
    .field {
      position: relative;
      display: inline-block;
    }

    .tooltip {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #bbb;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      white-space: nowrap;
      z-index: 10;
    }

    .tooltip::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 20px;
      width: 10px;
      height: 10px;
      background: #fff;
      border-top: 1px solid #bbb;
      border-left: 1px solid #bbb;
      transform: rotate(45deg);
    }

    .tooltip.visible {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Форма опроса</h1>

  <form class="form" novalidate>
    <p>
      <label>Имя пользователя:
        <span class="field">
          <input type="text" class="name">
          <span class="tooltip name-tooltip">Заполните это поле</span>
        </span>
      </label>
    </p>

    <p>
      <label>Email:
        <span class="field">
          <input type="text" class="email">
          <span class="tooltip email-tooltip">Заполните это поле</span>
        </span>
      </label>
    </p>

    <p>
      Пол:
      <label><input type="radio" name="gender" value="Мужской"> Мужской</label>
      <label><input type="radio" name="gender" value="Женский"> Женский</label>
    </p>

    <p>
      <label>Оценка сервиса:
        <input type="range" class="rating" min="1" max="10" value="5">
      </label>
      <span class="rating-value">5</span>
    </p>

    <div class="interests">
      Интересы пользователя:<br>
      <label><input type="checkbox" name="interest" value="Спорт"> Спорт</label><br>
      <label><input type="checkbox" name="interest" value="Музыка"> Музыка</label><br>
      <label><input type="checkbox" name="interest" value="Путешествия"> Путешествия</label><br>
      <label><input type="checkbox" name="interest" value="Кино"> Кино</label>
    </div>

    <p>
      <label>Дополнительные комментарии:<br>
        <textarea class="comments" rows="3" cols="35"></textarea>
      </label>
    </p>

    <button type="submit">Отправить</button>
  </form>

  <div class="result"></div>

  <script src="index.js"></script>
</body>
</html>
